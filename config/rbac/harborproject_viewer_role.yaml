# This rule is not used by the project harbor-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to harbor.satoruh.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: harbor-operator
    app.kubernetes.io/managed-by: kustomize
  name: harborproject-viewer-role
rules:
- apiGroups:
  - harbor.satoruh.org
  resources:
  - harborprojects
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - harbor.satoruh.org
  resources:
  - harborprojects/status
  verbs:
  - get
