---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: harborprojects.harbor.satoruh.org
spec:
  group: harbor.satoruh.org
  names:
    categories:
    - harbor
    kind: HarborProject
    listKind: HarborProjectList
    plural: harborprojects
    singular: harborproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectName
      name: Project
      type: string
    - jsonPath: .status.projectID
      name: ID
      type: integer
    - jsonPath: .spec.public
      name: Public
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.connectionRef.name
      name: Connection
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HarborProject is the Schema for the harborprojects API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HarborProject
            properties:
              adoptExisting:
                default: false
                description: |-
                  AdoptExisting allows the controller to take ownership of a project that
                  already exists in Harbor. Without it, finding a project with the same name
                  is an error.

                  This is only evaluated while the resource is not yet bound to a Harbor
                  project (status.projectID unset). Once bound, clearing this field does not
                  release the project; delete the resource with deletionPolicy Orphan instead.
                type: boolean
              connectionRef:
                description: |-
                  ConnectionRef selects the HarborConnection describing the target Harbor.

                  Immutable: pointing an existing resource at a different Harbor would leave
                  the project behind on the original instance while status.projectID still
                  refers to it.

                  To move a project to a different Harbor, delete and recreate this resource.
                  Set deletionPolicy to Orphan first, otherwise deletion removes the project
                  from the original Harbor.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: connectionRef is immutable
                  rule: self == oldSelf
              deletionPolicy:
                default: Orphan
                description: |-
                  DeletionPolicy decides what happens to the Harbor project when this
                  resource is deleted. Orphan leaves the project in Harbor; Delete removes it.

                  Note that recreating a resource is the only way to change connectionRef or
                  projectName, both of which are immutable. Switch to Orphan before deleting
                  if the Harbor project should survive.
                enum:
                - Delete
                - Orphan
                type: string
              projectName:
                description: ProjectName is the project name in Harbor. Immutable
                  once created.
                maxLength: 255
                minLength: 1
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
                x-kubernetes-validations:
                - message: projectName is immutable
                  rule: self == oldSelf
              public:
                description: |-
                  Public controls project visibility. When unset the controller does not
                  manage this attribute and leaves whatever Harbor has.
                type: boolean
            required:
            - connectionRef
            - projectName
            type: object
          status:
            description: status defines the observed state of HarborProject
            properties:
              conditions:
                description: Conditions represent the current state of the HarborProject.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last acted on.
                format: int64
                type: integer
              projectID:
                description: |-
                  ProjectID is the numeric ID of the project in Harbor. It is the primary
                  handle for reconciliation; when unset the controller falls back to a
                  lookup by name.
                format: int64
                type: integer
              repositoryCount:
                description: |-
                  RepositoryCount is the number of repositories in the project, used to
                  explain why deletion is blocked.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
