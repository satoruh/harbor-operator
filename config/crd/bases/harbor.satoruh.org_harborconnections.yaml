---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: harborconnections.harbor.satoruh.org
spec:
  group: harbor.satoruh.org
  names:
    categories:
    - harbor
    kind: HarborConnection
    listKind: HarborConnectionList
    plural: harborconnections
    singular: harborconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseURL
      name: URL
      type: string
    - jsonPath: .status.harborVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HarborConnection is the Schema for the harborconnections API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HarborConnection
            properties:
              baseURL:
                description: |-
                  BaseURL is the root URL of the Harbor API, without a trailing slash
                  and without the /api/v2.0 path (for example https://harbor.example.com).
                maxLength: 2048
                pattern: ^https?://
                type: string
              caBundleRef:
                description: |-
                  CABundleRef selects a ConfigMap containing a PEM-encoded CA bundle used
                  to verify the Harbor certificate. Required when Harbor is served with a
                  certificate that is not signed by a system-trusted CA.
                properties:
                  key:
                    default: ca.crt
                    description: Key holding the PEM-encoded certificate bundle.
                    type: string
                  name:
                    description: Name of the ConfigMap.
                    type: string
                required:
                - name
                type: object
              credentialsRef:
                description: |-
                  CredentialsRef selects the Secret holding the Harbor username and
                  password. The Secret must live in the operator's own namespace and
                  carry the label harbor.satoruh.org/credentials=true.
                properties:
                  name:
                    description: Name of the Secret.
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the key holding the Harbor password
                      or robot token.
                    type: string
                  usernameKey:
                    default: username
                    description: |-
                      UsernameKey is the key holding the Harbor username. For a robot account
                      this is the full name including the robot$ prefix.
                    type: string
                required:
                - name
                type: object
              insecureSkipVerify:
                default: false
                description: |-
                  InsecureSkipVerify disables TLS certificate verification.
                  Intended for development only; prefer CABundleRef.
                type: boolean
              syncPeriod:
                default: 10m
                description: |-
                  SyncPeriod is how often HarborProject resources bound to this connection
                  are reconciled against Harbor to detect drift. Harbor cannot be watched,
                  so this polling interval bounds how long a manual change persists.
                type: string
                x-kubernetes-validations:
                - message: syncPeriod must be at least 30s
                  rule: duration(self) >= duration('30s')
            required:
            - baseURL
            - credentialsRef
            type: object
          status:
            description: status defines the observed state of HarborConnection
            properties:
              conditions:
                description: Conditions represent the current state of the HarborConnection.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              harborVersion:
                description: HarborVersion is reported by the Harbor instance at the
                  last successful probe.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last acted on.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
